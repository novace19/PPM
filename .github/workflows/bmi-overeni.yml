name: BMI ověření na emulátoru
on:
  push:
    branches: [bmi-overeni-ukol01]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Sestavení a testy
        working-directory: BMI_Kalkulacka
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Povolení emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kontrola obrazovek
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd BMI_Kalkulacka && python3 ci-snimky.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmi-snimky
          path: BMI_Kalkulacka/snimky/*.png
