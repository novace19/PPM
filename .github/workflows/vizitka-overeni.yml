name: Ověření vizitky
on:
  push:
    branches: [overeni-vizitka]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Sestavení aplikace a testů
        working-directory: Vizitka_uzivatele
        run: bash gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Povolení KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testy a screenshot v emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd Vizitka_uzivatele && bash gradlew connectedDebugAndroidTest --console=plain && python3 ci-screenshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vizitka-vysledky
          path: |
            Vizitka_uzivatele/screenshot.png
            Vizitka_uzivatele/app/build/reports/androidTests/connected/
