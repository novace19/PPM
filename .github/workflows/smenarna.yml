name: Smenarna - build and screenshots
on:
  push:
    branches: [main]
    paths: ['Smenarna/**', '.github/workflows/smenarna.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check calculations and CNB parser
        run: bash Smenarna/checks/check.sh
      - name: Build and lint all three applications
        working-directory: Smenarna
        run: bash gradlew :basic1:assembleDebug :basic2:assembleDebug :top:assembleDebug :basic1:lintDebug :basic2:lintDebug :top:lintDebug --console=plain
      - name: Upload APKs and lint reports
        uses: actions/upload-artifact@v4
        with:
          name: smenarna-apk-and-reports
          path: |
            Smenarna/*/build/outputs/apk/debug/*.apk
            Smenarna/*/build/reports/lint-results-debug.html
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 Smenarna/checks/screenshots.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smenarna-real-screenshots
          path: Smenarna/screenshots/*.png
